# The hand kept entries for hl2_xbox.xbe.
#
# config/game.toml is the scan output: xbe_symbols writes it on every first
# build, so it is never edited. This file includes it and adds what the scan
# could not prove; entries here are read after the include and win over it.
includes = ["game.toml"]

# Argument locations in API order for functions whose image convention differs
# from the one the host declares. A register name, or "stack" for the next
# stack slot, which the callee pops. These are the locations the scan measured
# at each function's entry, in API argument order.
[abi]
# The host declares a two-argument fastcall (ecx, edx); this LTCG build passes
# the second argument in ebx and pops no stack bytes.
CDevice_KickOff = ["ecx", "ebx"]

# Two-argument stdcalls in the XDK, but this image takes the arguments in
# registers instead of on the stack.
D3DDevice_SelectVertexShader = ["eax", "ebx"]
D3DDevice_SetTransform        = ["eax", "edx"]

# Two-argument stdcall: the first argument is in eax, the second on the stack
# (one slot, four bytes popped by the callee).
D3D_BlockOnTime = ["eax", "stack"]

# One-argument stdcall: the resource is passed in esi instead of on the stack.
D3D_InternalRelease = ["esi"]

# A nine-byte allocator thunk immediately after a pointer table, with no
# padding: call 005BBBCE / add eax, 8 / ret. The linear sweep decoded past it,
# so the guest's call trapped at "function was not decoded". Verified by
# disassembling the bytes at 005BA637 in the XBE.
[[function]]
at = 0x005BA637
end = 0x005BA640

# D3D8I data globals the 5849 scan could not locate: this build is LTCG, so
# the signature anchors do not match. Each address was recovered from HL2's own
# code, not guessed (see docs/FINDINGS.md):
#   61EDF0  ORed with 0x4800 (D3DDIRTYFLAG_TEXTURE)
#   61EDF8  [state*4] read/written by every SetRenderState path
#   61C730  [stage*32 + type]*4 texture stage state array
#   61FDB8  stride-12 stream records; +8 is the vertex buffer field
#   772FB8  [state*4] method passed to the pushbuffer writer at 60D250
[data]
D3D_DirtyFlags            = 0x0061EDF0
D3D_RenderState           = 0x0061EDF8
D3D_DeferredTextureState  = 0x0061C730
D3D_Streams               = 0x0061FDB8
D3D_SimpleRenderStateEncode = 0x00772FB8

# The default FVF vertex shader object: 0x613AC1 does
#   mov dword ptr [ebp+0x794], 0x61FCA0
# where +0x794 is CDevice_VertexShader. CreateDevice mirrors this into the
# device; with the symbol missing the host wrote 0 and the guest faulted
# reading [0+4] in sub_0060C660.
D3D_FvfShader = 0x0061FCA0

# Index data base for inline draws: 0x60FCB4/0x60FCCB read 0x61EDEC, and
# 0x60FCBC lazily allocates it through the kernel if still zero.
D3D_IndexData = 0x0061EDEC
